{% extends "base.html" %}
{% block title %}Login | HelpDeskHub{% endblock %}
{% block content %}
  <section class="container page-main">
    <div class="form-panel">
      <p class="eyebrow">Welcome back</p>
      <h1>Login to HelpDeskHub</h1>
      <p class="form-intro">Use your college account to check on your support requests.</p>
      <form method="post" action="{{ url_for('auth.login') }}" data-validate novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="field">
          <label for="login-email">College email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" maxlength="254" required value="{{ email }}" aria-describedby="login-email-error">
          <small class="field-error" id="login-email-error" data-error-for="email"></small>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required aria-describedby="login-password-error">
          <small class="field-error" id="login-password-error" data-error-for="password"></small>
        </div>
        <button class="button button-full" type="submit">Login</button>
      </form>
      <p class="form-footnote">Need an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
  </section>
{% endblock %}
